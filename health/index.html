eader{padding:20px 17px}.opt{padding:12px}}</style></head><body><main class="wrap"><header><div class="eyebrow">狛江三中 3年｜2026年 2学期期末対策</div><h1>保健 100点チャレンジ</h1><div>大日本図書「中学校保健体育」保体702 / P.140〜155</div></header><div class="panel" id="home"><div class="stats" id="stats"></div><div class="bar"><div class="fill" id="progress"></div></div><h2>学習する範囲</h2><div id="topics"></div><div class="actions"><button class="primary" id="all">全問題に挑戦</button><button id="weak">間違えた問題だけ</button><button id="unseen">未回答の問題だけ</button></div><div class="muted">同じ問題を正解するまで再挑戦できます。学習履歴はこの端末のブラウザに自動保存されます。端末・ブラウザを変えると履歴は共有されません。</div><div class="actions"><button id="reset">学習記録をリセット</button></div></div><div class="panel hidden" id="quiz"><div class="actions"><button id="back">← 範囲選択に戻る</button><span class="pill" id="count"></span></div><div class="bar"><div class="fill" id="sessionbar"></div></div><div class="mark" id="category"></div><div id="question"></div><div class="opts" id="opts"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="primary hidden" id="next">次の問題へ →</button></div></div><div class="panel hidden" id="done"><h2>今回の学習が終了しました</h2><div id="result"></div><div class="actions"><button class="primary" id="again">範囲選択へ戻る</button><button id="retry">今回間違えた問題を再挑戦</button></div></div><footer>※公開されている単元・ページ対応に基づいて作成したオリジナル問題です。教科書本文・図表や学校配布プリントの全内容を直接照合したものではありません。P.144〜148の資料・章末部分は関連知識の復習問題を収録しています。学校の実物資料も併用してください。</footer></main><script>
const Q=[{"s":"社会の取り組み","q":"保健所の主な仕事は？","o":["地域全体の健康を守る専門的な活動","商品の価格を統制する","道路を建設する","学校の成績を評価する"],"a":0,"e":"保健所は地域の公衆衛生を支える。"},{"s":"社会の取り組み","q":"市区町村の保健センターの役割は？","o":["住民に身近な健康相談や健診","入国審査","裁判","道路交通取り締まり"],"a":0,"e":"市区町村の保健センターは住民に近い保健サービスを提供する。"},{"s":"社会の取り組み","q":"健康診断を受ける主な目的は？","o":["病気の早期発見や健康状態の把握","運動能力の順位付け","感染症を必ず治す","医療費を必ずゼロにする"],"a":0,"e":"健診は早期発見・健康管理に役立つ。"},{"s":"社会の取り組み","q":"予防接種の目的は？","o":["特定の感染症の発症や重症化を予防する","あらゆる病気を治す","筋力を伸ばす","視力を改善する"],"a":0,"e":"予防接種は免疫の仕組みを利用する。"},{"s":"社会の取り組み","q":"感染症の発生状況を調べ対策を進める組織として適切なのは？","o":["保健所","税務署","郵便局","運転免許試験場"],"a":0,"e":"保健所は感染症対策を担う。"},{"s":"社会の取り組み","q":"公衆衛生の説明として正しいのは？","o":["社会全体の健康を守り高める取り組み","個人の成績評価","治療薬の販売だけ","競技の公平性を決めること"],"a":0,"e":"公衆衛生は集団・地域の健康が対象。"},{"s":"社会の取り組み","q":"健康相談で利用できる身近な公的窓口は？","o":["市区町村の保健センター","裁判所","消防団のみ","税関"],"a":0,"e":"地域の相談先を知っておこう。"},{"s":"社会の取り組み","q":"感染症対策に当てはまるのは？","o":["手洗いや適切な換気","薬を友達と共有する","症状を隠して出席する","予防接種の記録を捨てる"],"a":0,"e":"個人の行動と社会の対策を組み合わせる。"},{"s":"社会の取り組み","q":"学校の健康診断は何に役立つ？","o":["健康課題への早期対応","成績の確定","部活の選抜のみに利用","感染を完全に防ぐ"],"a":0,"e":"異常が疑われたら受診につなげる。"},{"s":"社会の取り組み","q":"医療機関の主な役割は？","o":["診察・検査・治療を行う","水道料金の決定","給食の調理だけ","住民票の発行"],"a":0,"e":"保健機関と医療機関の役割の違いを整理。"},{"s":"社会の取り組み","q":"国民皆保険制度の特徴は？","o":["原則としてすべての人が公的医療保険に加入する","医療費が必ず無料","病院に行くことを禁じる","全員が同じ薬を使う"],"a":0,"e":"医療費の負担を社会で支える仕組み。"},{"s":"社会の取り組み","q":"健康づくりの主体として適切なのは？","o":["個人と社会の両方","国だけ","医師だけ","学校だけ"],"a":0,"e":"個人の努力と社会の支援の双方が必要。"},{"s":"医薬品","q":"医薬品の主作用とは？","o":["目的とする治療上の作用","目的以外の望ましくない作用","薬の見た目","服用の回数"],"a":0,"e":"主作用と副作用の違いが頻出。"},{"s":"医薬品","q":"副作用とは？","o":["目的以外に現れる望ましくない作用","主な治療効果","製造会社の名前","有効期限のこと"],"a":0,"e":"薬には副作用が生じる場合がある。"},{"s":"医薬品","q":"薬を決められた量より多く服用すると？","o":["副作用や健康被害の危険が増す","必ず早く治る","安全性が高まる","効果がなくなるだけ"],"a":0,"e":"用法・用量を守る。"},{"s":"医薬品","q":"用法とは何か？","o":["薬を使う方法やタイミング","薬の値段","製造番号","薬の色"],"a":0,"e":"用法と用量を区別。"},{"s":"医薬品","q":"用量とは何か？","o":["一度や一日などに使う薬の量","飲む時間だけ","薬の分類名","薬局の所在地"],"a":0,"e":"用量を守ることが重要。"},{"s":"医薬品","q":"医薬品の使用期限の扱いで
