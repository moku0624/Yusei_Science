<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>狛江三中 保健 期末テスト対策</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1e293b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:810px;margin:auto;padding:16px 14px 64px}header{background:linear-gradient(125deg,#174e81,#2676a2);color:white;border-radius:20px;padding:24px 21px;margin-bottom:18px}h1{margin:8px 0;font-size:clamp(22px,5vw,31px)}h2{font-size:19px}.eyebrow{font-size:13px;opacity:.9}.panel{border:1px solid #dbe4ee;background:white;border-radius:16px;padding:19px;margin:14px 0;box-shadow:0 2px 10px #18243b09}button,select{font:inherit}button{cursor:pointer;border-radius:11px;border:1px solid #b8c9da;background:white;color:#174e81;padding:11px 13px;font-weight:650}button.primary{color:white;background:#146a9a;border-color:#146a9a}button:disabled{cursor:default;opacity:.66}.bar{height:10px;border-radius:20px;background:#e5ebf2;overflow:hidden;margin:10px 0}.fill{height:100%;background:#22a182}.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#e6f3fa;color:#155a7e;border-radius:99px;padding:7px 10px;font-size:13px}.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e7edf5}.topic:last-child{border:0}.muted{color:#66778c;font-size:13px;line-height:1.65}.opts{display:grid;gap:9px}.opt{text-align:left;line-height:1.55;color:#263b56;font-weight:500;padding:15px}.opt.correct{border-color:#20a272;background:#e7f8ef;color:#12613e}.opt.wrong{border-color:#d05461;background:#fff0f2;color:#9b2436}.feedback{border-radius:12px;background:#f1f5f9;padding:15px;line-height:1.75;margin:12px 0}.hidden{display:none}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}#question{font-size:20px;line-height:1.6;font-weight:700;margin:22px 0}.mark{font-size:12px;color:#47627d}footer{font-size:12px;color:#63748b;line-height:1.7;margin-top:26px}select{width:100%;padding:12px;border-radius:10px;border:1px solid #b8c9da;background:white}@media(max-width:430px){.panel{padding:14px}header{padding:20px 17px}.opt{padding:12px}}</style></head><body><main class="wrap"><header><div class="eyebrow">狛江三中 3年｜2026年 2学期期末対策</div><h1>保健 100点チャレンジ【選択肢改訂版】</h1><div>大日本図書「中学校保健体育」保体702 / P.140〜155</div></header><div class="panel" id="home"><div class="stats" id="stats"></div><div class="bar"><div class="fill" id="progress"></div></div><h2>学習する範囲</h2><div id="topics"></div><div class="actions"><button class="primary" id="all">全問題に挑戦</button><button id="weak">間違えた問題だけ</button><button id="unseen">未回答の問題だけ</button></div><div class="muted">同じ問題を正解するまで再挑戦できます。学習履歴はこの端末のブラウザに自動保存されます。端末・ブラウザを変えると履歴は共有されません。</div><div class="actions"><button id="reset">学習記録をリセット</button></div></div><div class="panel hidden" id="quiz"><div class="actions"><button id="back">← 範囲選択に戻る</button><span class="pill" id="count"></span></div><div class="bar"><div class="fill" id="sessionbar"></div></div><div class="mark" id="category"></div><div id="question"></div><div class="opts" id="opts"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="primary hidden" id="next">次の問題へ →</button></div></div><div class="panel hidden" id="done"><h2>今回の学習が終了しました</h2><div id="result"></div><div class="actions"><button class="primary" id="again">範囲選択へ戻る</button><button id="retry">今回間違えた問題を再挑戦</button></div></div><footer>※公開されている単元・ページ対応に基づいて作成したオリジナル問題です。教科書本文・図表や学校配布プリントの全内容を直接照合したものではありません。P.144〜148の資料・章末部分は関連知識の復習問題を収録しています。学校の実物資料も併用してください。</footer></main><script>
const Q=[{"s":"社会の取り組み","q":"保健所の主な仕事は？","o":["地域全体の健康を守る専門的な活動","住民の健康相談と乳幼児健診だけを行う","患者一人ひとりに処方箋を出す","学校の健康診断だけを実施する"],"a":0,"e":"保健所は地域の公衆衛生を支える。"},{"s":"社会の取り組み","q":"市区町村の保健センターの役割は？","o":["住民に身近な健康相談や健診","主に感染症の広域監視と食品営業の許可を担当する","入院患者への治療を専門に行う","医薬品の製造承認を行う"],"a":0,"e":"市区町村の保健センターは住民に近い保健サービスを提供する。"},{"s":"社会の取り組み","q":"健康診断を受ける主な目的は？","o":["病気の早期発見や健康状態の把握","感染症への免疫を必ず獲得する","すでに発症した病気の治療を完了する","健診当日の体力だけを判定する"],"a":0,"e":"健診は早期発見・健康管理に役立つ。"},{"s":"社会の取り組み","q":"予防接種の目的は？","o":["特定の感染症の発症や重症化を予防する","感染後の症状を治療する","あらゆる感染を完全に防ぐ","接種直後から全員に永久の免疫を与える"],"a":0,"e":"予防接種は免疫の仕組みを利用する。"},{"s":"社会の取り組み","q":"感染症の発生状況を調べ対策を進める組織として適切なのは？","o":["保健所","学校保健委員会","市区町村の保健センターのみ","一般の診療所だけ"],"a":0,"e":"保健所は感染症対策を担う。"},{"s":"社会の取り組み","q":"公衆衛生の説明として正しいのは？","o":["社会全体の健康を守り高める取り組み","個人が病院で受ける治療だけを指す","運動習慣だけを改善する活動を指す","感染症の治療だけを社会全体で行うことを指す"],"a":0,"e":"公衆衛生は集団・地域の健康が対象。"},{"s":"社会の取り組み","q":"健康相談で利用できる身近な公的窓口は？","o":["市区町村の保健センター","厚生労働省の本省窓口だけ","感染症指定医療機関だけ","医薬品医療機器総合機構だけ"],"a":0,"e":"地域の相談先を知っておこう。"},{"s":"社会の取り組み","q":"感染症対策に当てはまるのは？","o":["手洗いや適切な換気","発症者だけが手洗いをする","症状がなければ換気を行わない","予防接種だけに頼り他の対策を省く"],"a":0,"e":"個人の行動と社会の対策を組み合わせる。"},{"s":"社会の取り組み","q":"学校の健康診断は何に役立つ？","o":["健康課題への早期対応","病気を完全に防ぐこと","健康状態にかかわらず治療を始めること","運動能力を評価して治療法を決定すること"],"a":0,"e":"異常が疑われたら受診につなげる。"},{"s":"社会の取り組み","q":"医療機関の主な役割は？","o":["診察・検査・治療を行う","地域の健康相談・行政指導だけを行う","感染症の発生統計を作ることだけに専念する","予防接種の制度だけを設計する"],"a":0,"e":"保健機関と医療機関の役割の違いを整理。"},{"s":"社会の取り組み","q":"国民皆保険制度の特徴は？","o":["原則としてすべての人が公的医療保険に加入する","すべての医療が自己負担なしになる","すべての人が同一の保険組合に加入する","病気にかかった人だけが加入する"],"a":0,"e":"医療費の負担を社会で支える仕組み。"},{"s":"社会の取り組み","q":"健康づくりの主体として適切なのは？","o":["個人と社会の両方","本人の生活習慣だけが関係する","行政の環境整備だけで達成できる","医療機関だけが責任を負う"],"a":0,"e":"個人の努力と社会の支援の双方が必要。"},{"s":"医薬品","q":"医薬品の主作用とは？","o":["目的とする治療上の作用","薬を飲んだときに現れるすべての作用","目的以外に起きる好ましくない作用","薬が体から排出される働き"],"a":0,"e":"主作用と副作用の違いが頻出。"},{"s":"医薬品","q":"副作用とは？","o":["目的以外に現れる望ましくない作用","治療のために期待される作用","薬の吸収が終わること","薬が目的の部位に届くこと"],"a":0,"e":"薬には副作用が生じる場合がある。"},{"s":"医薬品","q":"薬を const KEY="komae_health_702_v1";let record={};try{record=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{};let queue=[],position=0,wrong=[],answered=0;
const $=s=>document.getElementById(s),topics=[...new Set(Q.map(x=>x.s))],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(record))}catch{}},show=id=>{["home","quiz","done"].forEach(x=>$(x).classList.toggle("hidden",x!==id))};
function draw(){let good=Q.filter((q,i)=>record[i]?.ok).length,seen=Q.filter((q,i)=>record[i]?.tries>0).length;$("stats").innerHTML='<span class="pill">全 '+Q.length+'問</span><span class="pill">学習済み '+seen+'問</span><span class="pill">正解済み '+good+'問</span>';$("progress").style.width=(100*good/Q.length)+"%";$("topics").innerHTML="";topics.forEach(t=>{let ids=Q.map((q,i)=>q.s===t?i:-1).filter(i=>i>=0),g=ids.filter(i=>record[i]?.ok).length;let d=document.createElement("div");d.className="topic";let l=document.createElement("div");l.innerHTML="<b>"+t+"</b><div class=muted>"+g+" / "+ids.length+" 問クリア</div>";let b=document.createElement("button");b.textContent="学習する";b.onclick=()=>start(ids);d.append(l,b);$("topics").append(d)})}
function start(ids){queue=[...ids];position=0;wrong=[];answered=0;if(!ids.length){alert("対象の問題はありません");return}show("quiz");ask()}
function ask(){if(position>=queue.length){finish();return}let i=queue[position],q=Q[i];$("count").textContent=(position+1)+" / "+queue.length;$("sessionbar").style.width=(position/queue.length*100)+"%";$("category").textContent=q.s;$("question").textContent=q.q;$("opts").innerHTML="";$("feedback").classList.add("hidden");$("next").classList.add("hidden");let order=[0,1,2,3];for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}for(let n of order){let b=document.createElement("button");b.className="opt";b.textContent=q.o[n];b.onclick=()=>answer(n,b);$("opts").append(b)}}
function answer(n,b){let i=queue[position],q=Q[i],ok=n===q.a;answered++;record[i]={tries:(record[i]?.tries||0)+1,ok};save();if(!ok&&!wrong.includes(i))wrong.push(i);$("opts").querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===q.o[q.a])x.classList.add("correct")});if(!ok)b.classList.add("wrong");$("feedback").textContent=(ok?"正解！ ":"不正解。 ")+q.e;$("feedback").classList.remove("hidden");$("next").classList.remove("hidden");$("next").textContent=position===queue.length-1?"結果を見る":"次の問題へ →"}
function finish(){show("done");$("result").textContent="今回の出題 "+queue.length+"問／間違えた問題 "+wrong.length+"問。苦手分野を繰り返し確認しましょう。";$("retry").style.display=wrong.length?"":"none";draw()}
$("next").onclick=()=>{position++;ask()};$("back").onclick=()=>{show("home");draw()};$("again").onclick=()=>{show("home");draw()};$("retry").onclick=()=>start(wrong);$("all").onclick=()=>start(Q.map((_,i)=>i));$("weak").onclick=()=>start(Q.map((_,i)=>!record[i]?.ok&&record[i]?.tries?i:-1).filter(i=>i>=0));$("unseen").onclick=()=>start(Q.map((_,i)=>!record[i]?.tries?i:-1).filter(i=>i>=0));$("reset").onclick=()=>{if(confirm("学習履歴をすべて消去しますか？")){record={};save();draw()}};draw();
